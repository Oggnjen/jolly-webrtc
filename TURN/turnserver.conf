# /etc/turnserver.conf
listening-port=3478
tls-listening-port=5349

# Use your public IP or domain here (important for NAT/firewall)
external-ip=YOUR_PUBLIC_IP

# Auth mechanism: use static user (for simplicity) or database
user=username:password
# OR for long-term credentials (more secure):
# use-auth-secret
# static-auth-secret=your-shared-secret

realm=yourdomain.com

# Enable STUN and TURN
stale-nonce
no-loopback-peers
no-multicast-peers

# Logging (optional)
log-file=/var/log/turnserver/turn.log
no-stdout-log

# Certificates (if using TLS/DTLS)
# cert=/etc/coturn/certs/cert.pem
# pkey=/etc/coturn/certs/pkey.pem

# TURN relay port range (match EXPOSE in Dockerfile)
min-port=49152
max-port=65535